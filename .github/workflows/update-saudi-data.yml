name: Update Saudi market data

on:
  schedule:
    - cron: "*/15 7-12 * * 0-4"   # أثناء التداول (توقيت UTC) من الأحد إلى الخميس
    - cron: "30 13 * * 0-4"       # بعد الإغلاق
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: saudi-data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python saudi_market_update.py
      - name: Commit data
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          rm -rf /tmp/newdata && mkdir -p /tmp/newdata && cp data/*.json /tmp/newdata/
          for i in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p data && cp /tmp/newdata/*.json data/
            git add data/*.json
            if git diff --cached --quiet; then echo "no changes"; exit 0; fi
            git commit -m "update market data"
            if git push origin HEAD:main; then exit 0; fi
            sleep 5
          done
          exit 1
