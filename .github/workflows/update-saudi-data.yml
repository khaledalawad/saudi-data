name: Update Saudi market and news data

on:
  schedule:
    # جلسة التداول المستمر 10:00–15:00 بتوقيت الرياض (UTC+3)
    - cron: '*/15 7-11 * * 0-4'
    - cron: '0 12 * * 0-4'
    # تحديث ختامي بعد إغلاق السوق
    - cron: '30 13 * * 0-4'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: saudi-data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install market-data dependencies
        run: python -m pip install -r requirements.txt
      - name: Generate market data and company news
        run: |
          python saudi_market_update.py
          python saudi_news_update.py
      - name: Commit generated JSON files
        shell: bash
        run: |
          branch="${GITHUB_REF_NAME}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p /tmp/newdata
          cp data/*.json /tmp/newdata/
          for i in 1 2 3 4 5; do
            git fetch origin "$branch"
            git reset --hard "origin/$branch"
            mkdir -p data
            cp /tmp/newdata/*.json data/
            git add data/*.json
            if git diff --cached --quiet; then
              echo "No generated data changes."
              exit 0
            fi
            git commit -m "Update Saudi market and news data"
            if git push origin "HEAD:$branch"; then
              exit 0
            fi
            sleep 5
          done
          exit 1
